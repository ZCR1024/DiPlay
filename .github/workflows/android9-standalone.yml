name: DiPlay Android 9 test APK

# Applies android9-hotspot-channel.patch (SoftAP interface selection + measured iAP2 channel) to
# this branch, then builds :mobile:assembleStandaloneDebug. Debug-signed and suffixed with
# ".hudtest", so it installs beside an official package. The accessory identity is read out of the
# official release APK after its SHA256 is verified, so the build needs no repository secrets.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply the hotspot fixes
        run: |
          set -euo pipefail
          git log -1 --oneline
          git apply --check android9-hotspot-channel.patch
          git apply android9-hotspot-channel.patch
          M=shared/src/main/java/com/shilapi/xcertplay/network/ManualHotspotManager.kt
          grep -q 'resolvedChannel = channel.takeIf' "$M"
          grep -q 'startsWith("swlan") -> 90' "$M"
          grep -q 'interfaces up:' "$M"
      - name: Take the accessory identity from the official release
        run: |
          set -euo pipefail
          V=v0.2.11
          N=${V#v}
          curl -fsSL -o "$RUNNER_TEMP/app.apk" \
            "https://github.com/shihabal3amri/DiPlay/releases/download/$V/DiPlay-$N.apk"
          echo "57a3f5daf02af82f636baee26f28a475e04013de8174176c62d97d300498e4c9  $RUNNER_TEMP/app.apk" | sha256sum -c -
          D="$RUNNER_TEMP/auth-assets/offline-mfi"
          mkdir -p "$D"
          unzyp -jo "$RUNNER_TEMP/app.apk" "assets/offline-mfi/identity.pk8" "assets/offline-mfi/certificate.p7b" -d "$D"
          test -s "$D/identity.pk8" && test -s "$D/certificate.p7b"
          wc -c "$D/identity.pk8" "$D/certificate.p7b"
      - name: Build the car-test APK
        env:
          DIPLAY_AUTH_ASSETS_DIR: ${{ runner.temp }}/auth-assets
        run: ./gradlew :mobile:assembleStandaloneDebug --no-daemon
      - name: Check the identity reached the APK
        run: |
          set -euo pipefail
          APK=$(find mobile/build/outputs/apk -name '*.apk' -print -quit)
          unzip -l "$APK" | grep 'assets/offline-mfi/'
          cp "$APK" "$RUNNER_TEMP/DiPlay-android9-test.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: DiPlay-android9-test
          path: ${{ runner.temp }}/DiPlay-android9-test.apk
          retention-days: 30
